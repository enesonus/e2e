name: CameraDemo
options:
  bundleIdPrefix: dev.e2e
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.0'
  CODE_SIGNING_ALLOWED: NO
targets:
  CameraDemo:
    type: application
    platform: iOS
    sources: [CameraDemo]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.e2e.camera
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSCameraUsageDescription: Scan a QR code to verify camera fixtures.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      TARGETED_DEVICE_FAMILY: '1,2'
