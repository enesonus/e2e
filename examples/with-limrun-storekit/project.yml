name: StoreKitDemo
options:
  bundleIdPrefix: dev.e2e
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.0'
targets:
  StoreKitDemo:
    type: application
    platform: iOS
    sources: [StoreKitDemo]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.e2e.storekit
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      TARGETED_DEVICE_FAMILY: '1,2'
